# Keep the formula pointing at the newest oss-cli release.
#
# This used to be a step in oss-cli's own release workflow, pushing here with a
# personal access token. That token expired and the release silently shipped a
# formula still pointing at the previous version -- `brew upgrade` said "already
# installed" while a newer release existed, which is the worst kind of failure:
# nothing is broken, nothing is reported, and the user is simply not getting the
# thing that was published.
#
# The fix is to remove the cross-repo credential entirely. oss-cli is public, so
# its releases are readable with no authentication at all, and a workflow here
# writes to its OWN repository using the automatic GITHUB_TOKEN. Nothing to
# rotate, nothing to expire.
name: Bump formula

on:
  # Polled rather than pushed, because a push needs a credential and that is the
  # thing being removed -- the last one expired and shipped a stale formula.
  #
  # Daily rather than three-hourly, because this is now the safety net and no
  # longer the route. oss-cli's release.sh starts this workflow itself the
  # moment it has tagged, using the credential the person releasing already has
  # in their own shell: nothing is stored here, nothing expires, and the formula
  # is current within a minute of the release rather than within three hours.
  # Eight runs a day to catch a release that happens twice a week was the
  # arithmetic that made this worth changing.
  schedule:
    - cron: "17 6 * * *"
  # Started by release.sh, and by hand when a release was cut some other way.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the newest release
        id: latest
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/oss-cli/releases/latest"
          tag=$(curl -fsSL "$api" | jq -r .tag_name)
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "no release found"; exit 1; }
          version="${tag#v}"
          base="https://github.com/${GITHUB_REPOSITORY_OWNER}/oss-cli/releases/download/${tag}"

          # Hash what is actually published, per platform. The formula ships
          # self-contained archives now -- one per platform, each with its own
          # runtime -- so a single url/sha256 pair cannot describe it. An earlier
          # version of this step patched exactly one pair and left `version`
          # alone, which could not bump anything and would have pointed a
          # tarball formula at a bare jar.
          for a in macos-arm64 linux-x64; do
            curl -fsSL "$base/oss-$a.tar.gz" -o "/tmp/$a.tar.gz"
            echo "sha_$a=$(sha256sum "/tmp/$a.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base"       >> "$GITHUB_OUTPUT"
          echo "latest release: $tag"

      - name: Update the formula if it has moved
        run: |
          set -euo pipefail
          v="${{ steps.latest.outputs.version }}"
          base="${{ steps.latest.outputs.base }}"

          # Anchored per platform rather than a blanket substitution: the formula
          # holds two url/sha256 pairs, and replacing them without distinguishing
          # macOS from Linux would give both platforms one architecture's archive.
          python3 - "$v" "$base" \
            "${{ steps.latest.outputs.sha_macos-arm64 }}" \
            "${{ steps.latest.outputs.sha_linux-x64 }}" <<'PY'
          import re, sys
          v, base, mac_sha, linux_sha = sys.argv[1:5]
          s = open("oss.rb").read()
          s = re.sub(r'version "[^"]*"', f'version "{v}"', s, count=1)
          s = re.sub(r'(on_arm do\s*\n\s*url ")[^"]*(")',
                     lambda m: m.group(1) + f"{base}/oss-macos-arm64.tar.gz" + m.group(2), s)
          s = re.sub(r'(on_intel do\s*\n\s*url ")[^"]*(")',
                     lambda m: m.group(1) + f"{base}/oss-linux-x64.tar.gz" + m.group(2), s)
          # Each sha256 follows its own url, so replace them in document order.
          shas = iter([mac_sha, linux_sha])
          s = re.sub(r'sha256 "[^"]*"', lambda m: f'sha256 "{next(shas)}"', s)
          open("oss.rb", "w").write(s)
          PY

          # No diff means the formula is already current -- the normal outcome of
          # a poll, and not something to commit or report as work.
          if git diff --quiet; then
            echo "already at ${{ steps.latest.outputs.version }}"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump formula to v${{ steps.latest.outputs.version }}"
          git push
          echo "bumped to ${{ steps.latest.outputs.version }}"
